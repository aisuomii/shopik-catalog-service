# Local counterpart of the ConfigMap: same shape, same loader.
# Run with CONFIG_PATH=local-deployment/config.yaml to exercise the file path;
# without it the service falls back to the env-default tags, which point here too.
app:
  env: local
  shutdown_timeout: 10s

postgres:
  host: localhost
  port: 5433
  user: catalog
  database: catalog
  ssl_mode: disable
  max_open_conns: 10
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
